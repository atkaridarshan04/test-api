name: QA release pipeline

on:
  push:
    branches:
      - release-*

jobs:
  qa-release:
    uses: atkaridarshan04/shared-ci-actions/.github/workflows/qa-release.yml@v1
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      service-name: api
      service-label: api
      helm-key: .services.api.imageTag
      build-args: |
        APP_ENV=${{ vars.APP_ENV }}
      integration-branch: develop
      helm-repo: atkaridarshan04/test-helm-charts
      helm-owner: atkaridarshan04
      helm-repo-name: test-helm-charts
      runner: ubuntu-latest
      helm-bot-client-id: ${{ vars.HELM_BOT_CLIENT_ID }}
    secrets:
      helm-bot-app-private-key: ${{ secrets.HELM_BOT_APP_PRIVATE_KEY }}