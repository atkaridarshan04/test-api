name: Dev pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  dev-pipeline:
    uses: atkaridarshan04/shared-ci-actions/.github/workflows/dev-pipeline.yml@main
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      service-name: api
      service-label: api
      helm-key: .services.api.imageTag
      semgrep-configs: >-
        p/python p/fastapi p/dockerfile p/cwe-top-25 p/owasp-top-ten p/r2c-security-audit p/secure-defaults p/secrets p/sql-injection
      build-args: |
        APP_ENV=${{ vars.APP_ENV }}
      helm-repo: atkaridarshan04/test-helm-charts
      helm-owner: atkaridarshan04
      helm-repo-name: test-helm-charts
      runner: ubuntu-latest
      # TEMP: testing the rebuild/rescan pipeline change, not the base image's
      # real CVEs - re-enable (remove this line) once that's done
      fail-on-findings: "false"
      helm-bot-client-id: ${{ vars.HELM_BOT_CLIENT_ID }}
    secrets:
      helm-bot-app-private-key: ${{ secrets.HELM_BOT_APP_PRIVATE_KEY }}