name: Dev pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # GHCR paths must be lowercase; set this explicitly if your owner or repo
  # name has uppercase letters.
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: atkaridarshan04/shared-ci-actions/.github/actions/semgrep-scan-and-comment@main
        with:
          semgrep-configs: >-
            p/python p/fastapi p/dockerfile p/cwe-top-25 p/owasp-top-ten p/r2c-security-audit p/secure-defaults p/secrets p/sql-injection

  build-and-scan:
    name: Build, Trivy Scan, and Push Candidate (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      CANDIDATE_TAG: pr-${{ github.event.pull_request.number }}-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build and scan before logging in: nothing unscanned can reach the registry
      - uses: atkaridarshan04/shared-ci-actions/.github/actions/build-candidate-image@main
        with:
          image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}
          build-args: |
            APP_ENV=${{ vars.APP_ENV }}

      - uses: atkaridarshan04/shared-ci-actions/.github/actions/trivy-scan-and-comment@main
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}
          label: api image
          # report-only: known base-image CVEs in this fixture's Dockerfile
          # are out of scope while we're testing pipeline mechanics, not app security
          fail-on-findings: "false"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned candidate image
        run: docker push "${REGISTRY}/${IMAGE_NAME}:${CANDIDATE_TAG}"

  promote-image:
    name: Promote Scanned Candidate (push events)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      image_tag: ${{ steps.promote.outputs.release-tag }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - id: promote
        uses: atkaridarshan04/shared-ci-actions/.github/actions/promote-candidate-image@main
        with:
          component-name: api
          image-repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          base-branch: develop

  update-helm-repo:
    name: Update dev values.yaml in the Helm-charts repo
    runs-on: ubuntu-latest
    needs: promote-image
    if: github.event_name == 'push'
    steps:
      - id: helm-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HELM_BOT_APP_ID }}
          private-key: ${{ secrets.HELM_BOT_APP_PRIVATE_KEY }}
          owner: atkaridarshan04
          repositories: test-helm-charts
      - uses: atkaridarshan04/shared-ci-actions/.github/actions/update-helm-chart@main
        with:
          yaml-path: .services.api.imageTag
          helm-repo: atkaridarshan04/test-helm-charts
          values-file: dev/values.yaml
          image-tag: ${{ needs.promote-image.outputs.image_tag }}
          component-label: api
          helm-repo-token: ${{ steps.helm-app-token.outputs.token }}
          commit-user-name: ${{ steps.helm-app-token.outputs.app-slug }}[bot]
          commit-user-email: ${{ vars.HELM_BOT_APP_ID }}+${{ steps.helm-app-token.outputs.app-slug }}[bot]@users.noreply.github.com